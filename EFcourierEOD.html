<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eureka Forbes Courier Operations Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box} body{margin:0;background:#fff;font-family:Arial,Helvetica,sans-serif;color:#0a2450}
.wrap{max-width:1540px;margin:auto;background:#fff}
.header{height:104px;background:linear-gradient(100deg,#061d50,#07316e);color:#fff;display:flex;align-items:center;padding:12px 22px;border-radius:0 0 12px 12px}
.logo{width:285px;font-weight:800;line-height:.86;font-size:29px;letter-spacing:-1px;position:relative;padding-left:58px}
.logo:before{content:"+";position:absolute;left:0;top:-5px;width:46px;height:46px;border-radius:7px;font-size:57px;line-height:39px;text-align:center;background:#fff;color:#123b82}
.logo small{display:block;font-size:15px;font-weight:400;letter-spacing:0;margin-top:9px}
.title{flex:1;text-align:center}
.title h1{margin:0;font-size:32px;letter-spacing:.2px}.title p{margin:5px 0 0;font-size:21px}
.datebox{width:225px;border:1px solid rgba(255,255,255,.75);border-radius:9px;padding:11px 14px;text-align:center;font-size:15px}.datebox b{display:block;font-size:19px;margin-top:3px}
.controls{padding:12px 18px;display:flex;gap:10px;align-items:center;border-bottom:1px solid #e4e9f1;background:#fafcff}
.controls input[type=file]{max-width:300px}.controls label{font-weight:700;font-size:13px}.controls input[type=number]{margin-left:5px;padding:7px;border:1px solid #ccd5e3;border-radius:6px;width:100px}
button{border:0;border-radius:7px;padding:9px 15px;font-weight:700;cursor:pointer}.primary{background:#073a86;color:#fff}.secondary{background:#e8edf5;color:#12376e}.status{font-size:12px;color:#61708a;margin-left:auto}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;padding:17px 20px 10px}
.card{height:128px;border:1px solid #d9e1ec;border-radius:9px;background:#fff;display:flex;align-items:center;padding:16px 18px;box-shadow:0 2px 7px rgba(8,40,90,.05)}
.icon{width:70px;height:70px;border-radius:9px;background:#073c8c;color:#fff;display:flex;align-items:center;justify-content:center;font-size:37px;margin-right:22px}
.card:nth-child(2) .icon{background:#f47a05}.card:nth-child(3) .icon{background:#063c8c}.card:nth-child(4) .icon{background:#6422a0}.card:nth-child(5) .icon{background:#0d6f79}
.card h3{margin:0 0 6px;font-size:16px}.value{font-size:40px;font-weight:800;line-height:1}.sub{font-size:19px;font-weight:800;margin-top:6px}
.orange{color:#e8750a}.blue{color:#063b83}.purple{color:#63259b}.teal{color:#086d78}
.row{display:grid;gap:16px;padding:10px 20px}.r1{grid-template-columns:1.25fr .98fr .98fr 1.12fr}.r2{grid-template-columns:1.25fr .98fr 2.1fr}
.panel{border:1px solid #d9e1ec;border-radius:9px;overflow:hidden;background:#fff;min-height:250px}.ph{height:38px;background:linear-gradient(90deg,#05255b,#083d87);color:#fff;font-size:16px;font-weight:800;padding:10px 15px}.ph small{display:block;font-size:13px;margin-top:2px}.panelbody{padding:12px 14px;min-height:210px}
.chartbox{height:190px}.donutwrap{height:200px;display:flex;align-items:center;gap:8px}.donutwrap canvas{width:55%!important;height:190px!important}.legend{font-size:13px;line-height:1.8}.legend div{display:flex;align-items:center;gap:8px}.sw{width:17px;height:17px;border-radius:2px;display:inline-block}.legend b{font-size:14px}
.tat{display:grid;grid-template-columns:1fr 105px;gap:10px;align-items:center}.totalbox{border:1px solid #dfe5ee;border-radius:8px;text-align:center;padding:15px 4px}.totalbox span{display:block;font-size:16px;font-weight:700}.totalbox b{display:block;font-size:39px;margin-top:12px}
.agepanel .panelbody{padding:9px 15px}.table{width:100%;border-collapse:collapse;font-size:14px}.table th{text-align:left;background:#f5f7fa;padding:9px 6px}.table td{padding:7px 6px;border-bottom:1px solid #edf0f5}.table td:last-child,.table th:last-child{text-align:right}.table .total td{font-weight:800;background:#f5f7fa}
.flow{padding:9px 16px}.flowrow{display:grid;grid-template-columns:160px 1fr 50px 70px;gap:8px;align-items:center;height:32px;font-size:13px;font-weight:700}.barbg{height:15px;background:#f0f2f5;border-radius:4px;overflow:hidden}.bar{height:100%;border-radius:4px}.flowrow:nth-child(1) .bar{background:#0a3c86}.flowrow:nth-child(2) .bar{background:#3d9c3b}.flowrow:nth-child(3) .bar{background:#f27c08}.flowrow:nth-child(4) .bar{background:#6a25a0}.flowrow:nth-child(5) .bar{background:#11747e}.flowrow:nth-child(6) .bar{background:#e51d20}.flowrow:nth-child(7) .bar{background:#7b8a9b}.flowrow:nth-child(8) .bar{background:#f2b417}.flowrow:nth-child(9) .bar{background:#0a3c86}
.footer{margin-top:30px;background:linear-gradient(90deg,#05255b,#073a82);color:#fff;padding:14px 27px;font-size:13px;font-weight:700;display:flex;justify-content:space-between}
.empty{margin:20px;padding:35px;text-align:center;border:2px dashed #cdd7e6;border-radius:10px;color:#64748b}
@media(max-width:1100px){.grid5,.r1,.r2{grid-template-columns:1fr 1fr}.title h1{font-size:23px}.logo{width:190px}.datebox{width:190px}}
@media(max-width:700px){.grid5,.r1,.r2{grid-template-columns:1fr}.header{height:auto;gap:15px;flex-wrap:wrap}.title{order:3;flex-basis:100%}.controls{flex-wrap:wrap}.status{width:100%;margin-left:0}}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="logo">EUREKA<br>FORBES<small>Your friend for life</small></div>
    <div class="title"><h1>EUREKA FORBES COURIER OPERATIONS DASHBOARD</h1><p>Daily Overview &amp; Operational Summary</p></div>
    <div class="datebox">▣ &nbsp; Reporting Date<b id="reportDate">28 August 2026</b></div>
  </div>

  <div class="controls">
    <input id="fileInput" type="file" accept=".xlsx,.xls,.csv">
    <button class="primary" onclick="generate()">Generate Report</button>
    <button class="secondary" onclick="clearReport()">Clear</button>
    <span class="status" id="status">Upload the raw Excel file. Courier records will be used automatically.</span>
  </div>

  <div id="dashboard">
    <div class="empty">Upload the Courier/Porter raw dataset to generate the Courier report.</div>
  </div>
</div>

<script>
let charts=[];
const norm=s=>String(s??'').trim().toLowerCase().replace(/[^a-z0-9]/g,'');
function header(row, names){
  for(const n of names){const k=Object.keys(row).find(x=>norm(x)===norm(n));if(k)return k}
  return null;
}
function n(v){const x=Number(String(v??'').replace(/,/g,''));return Number.isFinite(x)?x:null}
function pct(x,total){return total?((x/total)*100).toFixed(2)+'%':'0.00%'}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function dateValue(v){
  if (v === null || v === undefined || v === '') return null;

  // Already a valid JS Date
  if (v instanceof Date && !isNaN(v.getTime())) {
    return new Date(v.getFullYear(), v.getMonth(), v.getDate());
  }

  // Excel serial date
  if (typeof v === 'number' && Number.isFinite(v)) {
    const d = new Date(Math.round((v - 25569) * 86400 * 1000));
    return isNaN(d.getTime())
      ? null
      : new Date(d.getFullYear(), d.getMonth(), d.getDate());
  }

  const s = String(v).trim();
  if (!s) return null;

  // DD/MM/YYYY or DD/MM/YY
  let m = s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})$/);

  if (m) {
    let day = Number(m[1]);
    let month = Number(m[2]) - 1;
    let year = Number(m[3]);

    if (year < 100) year += 2000;

    const d = new Date(year, month, day);

    // Validate the date
    if (
      d.getFullYear() === year &&
      d.getMonth() === month &&
      d.getDate() === day
    ) {
      return d;
    }

    return null;
  }

  // Fallback for other valid date formats
  const d = new Date(s);
  return isNaN(d.getTime())
    ? null
    : new Date(d.getFullYear(), d.getMonth(), d.getDate());
}
function fmtDate(d){
  if(!d)return '28 August 2026';
  return d.toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'});
}
function firstDate(rows, key){
  const ds=rows.map(r=>dateValue(r[key])).filter(Boolean);
  return ds.length?new Date(Math.max(...ds.map(x=>x.getTime()))):null;
}
function countYes(rows,key){return key?rows.filter(r=>String(r[key]).trim().toLowerCase()==='y'||String(r[key]).trim().toLowerCase()==='yes').length:0}
function countNo(rows,key){return key?rows.filter(r=>String(r[key]).trim().toLowerCase()==='n'||String(r[key]).trim().toLowerCase()==='no').length:0}
function makeDonut(id, vals, colors){
  return new Chart(document.getElementById(id),{type:'doughnut',data:{labels:vals.map(x=>x.label),datasets:[{data:vals.map(x=>x.value),backgroundColor:colors,borderColor:'#fff',borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,cutout:'56%',plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${c.label}: ${c.raw} (${pct(c.raw,vals.reduce((a,b)=>a+b.value,0))})`}}}}});
}
function legend(vals,colors){
  return vals.map((x,i)=>`<div><span class="sw" style="background:${colors[i]}"></span><span>${esc(x.label)}<br><b>${x.value} (${pct(x.value,vals.reduce((a,b)=>a+b.value,0))})</b></span></div>`).join('')
}
function build(data){
  charts.forEach(c=>c.destroy());charts=[];
  const partner=header(data[0],['Assigned Partner','Partner','AssignedPartner']);
  const rows=partner?data.filter(r=>norm(r[partner])==='courier'):data;
  const total=rows.length;
  const booking=header(rows[0],['Booking Status']);
  const pickup=header(rows[0],['Pickup Completed (Y/N)','Pickup Completed','PickupCompleted']);
  const delivery = header(rows[0], [
  'Delivered (Y/N)',
  'Delivered Y/N',
  'Delivered Status',
  'Delivery Status',
  'Delivered'
]);
  const grn=header(rows[0],['GRN Confirmed (Y/N)','GRN Confirmed','GRNConfirmed']);
  const hub=header(rows[0],['DMS / Hub','DMS/Hub','DMS/HUB','DMS Hub']);
  const age=header(rows[0],['Request to pickup ageing','Request to Pickup Ageing','Request to pickup ageing (Days)','Request To Pickup Ageing']);
  const pickupDate=header(rows[0],['Actual Pickup Date','ActualPickupDate']);
  const deliveredDate=header(rows[0],['Actual Delivery Date','Delivery Date','Delivered Date']);
  const bookingVals=[
    {label:'Booked',value:booking?rows.filter(r=>norm(r[booking])==='booked').length:0},
    {label:'Not Booked',value:booking?rows.filter(r=>norm(r[booking])==='notbooked').length:0}
  ];
  const autoDenied=booking?rows.filter(r=>norm(r[booking])==='autodenied').length:0;
  const pickupY=countYes(rows,pickup), pickupN=countNo(rows,pickup);
  const delY=countYes(rows,delivery), delN=countNo(rows,delivery);
  const grnY=countYes(rows,grn), grnN=countNo(rows,grn);

// ===============================
// REQUEST TO PICKUP AGEING
// Actual Pickup Date - Pickup Request Date
// ===============================
const ages = {
  '0-3 Days': 0,
  '3-5 Days': 0,
  '5-10 Days': 0,
  '10-15 Days': 0,
  'Above 15 Days': 0
};

const requestDate = header(rows[0], [
  'Pickup Request Date',
  'Request Date',
  'PickupRequestDate'
]);

rows.filter(r => !pickup || String(r[pickup]).trim().toLowerCase() === 'n').forEach(r => {
  const request = requestDate ? dateValue(r[requestDate]) : null;
  const pickupActual = pickupDate ? dateValue(r[pickupDate]) : null;

  // Only calculate when both dates exist
  if (request && pickupActual) {
    const days = Math.floor(
      (pickupActual - request) / 86400000
    );

    // Negative values are also included in 0-3 Days
    if (days < 3) {
      ages['0-3 Days']++;
    } else if (days < 5) {
      ages['3-5 Days']++;
    } else if (days < 10) {
      ages['5-10 Days']++;
    } else if (days < 15) {
      ages['10-15 Days']++;
    } else {
      ages['Above 15 Days']++;
    }
  }
});


// ===============================
// ORDER PICKUP TO DELIVERED TAT
// Actual Delivery Date - Actual Pickup Date
// ===============================
const tatCounts = {};

if (pickupDate && deliveredDate) {
  rows.filter(r => !pickup || String(r[pickup]).trim().toLowerCase() === 'n').forEach(r => {
    const actualPickup = dateValue(r[pickupDate]);
    const actualDelivery = dateValue(r[deliveredDate]);

    // Only delivered orders with both dates
    if (actualPickup && actualDelivery) {
      const days = Math.floor(
        (actualDelivery - actualPickup) / 86400000
      );

      tatCounts[days] = (tatCounts[days] || 0) + 1;
    }
  });
}

// NO fallback/demo values

  const hubs={};
  if(hub)rows.forEach(r=>{const h=String(r[hub]??'').trim();if(h)hubs[h]=(hubs[h]||0)+1});
  const hubRows=Object.entries(hubs).sort((a,b)=>b[1]-a[1]);

  document.getElementById('reportDate').textContent=fmtDate(firstDate(rows,header(rows[0],['Pickup Request Date','Request Date','PickupRequestDate'])));
  document.getElementById('status').textContent=`Courier report generated: ${total} orders`;

  document.getElementById('dashboard').innerHTML=`
  <div class="grid5">
    ${card('▤','Total Orders',total,'blue','')}
    ${card('▤','Total Booked Orders',bookingVals[0].value,'orange',pct(bookingVals[0].value,total))}
    ${card('▣','Pickup Completed',pickupY,'blue',pct(pickupY,total))}
    ${card('▣','Delivered',delY,'purple',pct(delY,total))}
    ${card('✓','GRN Confirmed',grnY,'teal',pct(grnY,total))}
  </div>

  <div class="row r1">
    <div class="panel"><div class="ph">ORDER PICKUP TO DELIVERED TAT (DAYS)</div><div class="panelbody tat"><div class="chartbox"><canvas id="tat"></canvas></div><div class="totalbox"><span>Total Orders</span><b>${delY}</b></div></div></div>
    ${donutPanel('BOOKING STATUS','bookingChart',bookingVals,['#073b83','#e8a51a'])}
    ${donutPanel('DELIVERED STATUS','deliveryChart',[{label:'No',value:delN},{label:'Yes',value:delY}],['#073b83','#31953a'])}
    ${donutPanel('GRN CONFIRMED STATUS','grnChart',[{label:'No',value:grnN},{label:'Yes',value:grnY}],['#073b83','#31953a'])}
  </div>

  <div class="row r2">
    <div class="panel agepanel"><div class="ph">REQUEST TO PICKUP AGEING<br><small>(Pickup Completed = N)</small></div><div class="panelbody"><div class="chartbox"><canvas id="ageChart"></canvas></div></div></div>
    <div class="panel"><div class="ph">DMS / HUB WISE ORDERS</div><div class="panelbody"><table class="table"><thead><tr><th>DMS / HUB</th><th>Count of WO No.</th></tr></thead><tbody>${hubRows.map(x=>`<tr><td>${esc(x[0])}</td><td>${x[1]}</td></tr>`).join('')}<tr class="total"><td>Total</td><td>${total}</td></tr></tbody></table></div></div>
    <div class="panel"><div class="ph">KEY OPERATIONAL FLOW (COUNTS)</div><div class="flow">${flowRow('Total Orders',total,total,'#0a3c86')}${flowRow('Booked',bookingVals[0].value,total,'#3d9c3b')}${flowRow('Pickup Completed',pickupY,total,'#f27c08')}${flowRow('Delivered',delY,total,'#6a25a0')}${flowRow('GRN Confirmed',grnY,total,'#11747e')}${flowRow('Not Booked',bookingVals[1].value,total,'#e51d20')}${flowRow('Pickup Pending',pickupN,total,'#7b8a9b')}${flowRow('Not Delivered',delN,total,'#f2b417')}${flowRow('GRN Pending',grnN,total,'#0a3c86')}</div></div>
  </div>
  <div class="footer"><span>Note: Percentages are calculated against Total Orders (${total})</span><span>Source: Courier Data &nbsp; | &nbsp; Data as on ${fmtDate(firstDate(rows,header(rows[0],['Pickup Request Date','Request Date','PickupRequestDate'])))}</span></div>
  `;

  charts.push(new Chart(document.getElementById('tat'),{type:'bar',data:{labels:Object.keys(tatCounts),datasets:[{data:Object.values(tatCounts),backgroundColor:'#073b83',borderRadius:3,barThickness:25}]},options:{indexAxis:'y',responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,title:{display:true,text:'Count of WO No.'}},y:{title:{display:true,text:'TAT (Days)'}}}}}));
  charts.push(makeDonut('bookingChart',bookingVals,['#073b83','#e8a51a']));
  charts.push(makeDonut('deliveryChart',[{label:'No',value:delN},{label:'Yes',value:delY}],['#073b83','#31953a']));
  charts.push(makeDonut('grnChart',[{label:'No',value:grnN},{label:'Yes',value:grnY}],['#073b83','#31953a']));
  charts.push(new Chart(document.getElementById('ageChart'),{type:'bar',data:{labels:Object.keys(ages),datasets:[{data:Object.values(ages),backgroundColor:'#073b83',borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,title:{display:true,text:'Count of WO No.'}},x:{title:{display:true,text:'Ageing Range'}}}}}));
}
function card(icon,title,value,cls,sub){return `<div class="card"><div class="icon">${icon}</div><div><h3>${title}</h3><div class="value ${cls}">${value}</div>${sub?`<div class="sub ${cls}">(${sub})</div>`:''}</div></div>`}
function donutPanel(title,id,vals,colors){return `<div class="panel"><div class="ph">${title}</div><div class="panelbody donutwrap"><canvas id="${id}"></canvas><div class="legend">${legend(vals,colors)}</div></div></div>`}
function flowRow(label,value,total,color){return `<div class="flowrow"><span>${label}</span><div class="barbg"><div class="bar" style="width:${total?value/total*100:0}%;background:${color}"></div></div><span style="text-align:right">${value}</span><span style="text-align:right">(${pct(value,total)})</span></div>`}

function generate(){
 const file=document.getElementById('fileInput').files[0];
 if(!file){alert('Please upload the raw Excel file first.');return}
 const reader=new FileReader();
 reader.onload=e=>{
   try{
     const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array',cellDates:true});
     const ws=wb.Sheets[wb.SheetNames[0]];
     const data=XLSX.utils.sheet_to_json(ws,{defval:''});
     if(!data.length)throw new Error('No data found in the first worksheet.');
     build(data);
   }catch(err){alert('Could not generate the report: '+err.message)}
 };
 reader.readAsArrayBuffer(file);
}
function clearReport(){
 document.getElementById('fileInput').value='';
 document.getElementById('status').textContent='Upload the raw Excel file. Courier records will be used automatically.';
 charts.forEach(c=>c.destroy());charts=[];
 document.getElementById('dashboard').innerHTML='<div class="empty">Upload the Courier/Porter raw dataset to generate the Courier report.</div>';
}
</script>
</body>
</html>
