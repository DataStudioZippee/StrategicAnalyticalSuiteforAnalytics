<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SDD PAN India Pendency</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<style>
body{
  margin:0;
  font-family:"Segoe UI";
  background:url('Zippee.png') center/cover fixed no-repeat;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:rgba(255,255,255,.2);
  backdrop-filter:blur(6px);
  z-index:-1;
}

/* HEADER */
.header{
  background:linear-gradient(90deg,rgba(0,63,140,.85),rgba(0,89,179,.85));
  color:white;
  padding:18px 36px;
}

/* CARD */
.card{
  background:rgba(255,255,255,0.16);
  backdrop-filter:blur(10px);
  margin:40px auto;
  width:fit-content;
  min-width:700px;
  padding:30px;
  border-radius:18px;
  text-align:left;
  box-sizing:border-box;
}

/* UPLOAD */
.upload-row{
  display:flex;
  gap:24px;
  flex-wrap:wrap;
  margin-bottom:10px;
}
.upload-box{
  background:rgba(255,255,255,0.55);
  border:1px dashed #062e44;
  border-radius:10px;
  padding:12px 16px;
  min-width:320px;
}
.upload-box label{
  display:block;
  font-weight:700;
  font-size:13px;
  color:#062e44;
  margin-bottom:6px;
}
.upload-hint{
  font-size:11px;
  color:#333;
  margin-top:4px;
}
.upload-status{
  font-size:11px;
  margin-top:6px;
  color:#0a5c36;
  font-weight:600;
}
.file-list{
  list-style:none;
  padding:0;
  margin:6px 0 0;
  font-size:11px;
}
.file-list li{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:2px 0;
  border-bottom:1px solid rgba(0,0,0,0.08);
}
.file-list button{
  border:none;
  background:none;
  color:#b00020;
  cursor:pointer;
  font-size:11px;

}
.clear-btn{
  margin-top:8px;

  color:#fff;
  border:none;
  border-radius:4px;
  cursor:pointer;

/* FILTER */
.filter-box{
  margin-top:15px;

/* TABLE */
table{
  width:100%;
  max-width:700px;
  margin:auto;
  border-collapse:collapse;
  border-radius:0 0 6px 6px;
  overflow:hidden;
  box-shadow:0 8px 20px rgba(0,0,0,0.2);
}
th,td{
  border:1px solid #ddd;
  padding:5px 6px;
  font-size:12px;
  text-align:center;
}
th{
  background:#062e44;
  color:white;
}
td.store{
  font-weight:600;
}
tr.subtotal{
  background:#f1f3f5;
  font-weight:600;
}
#downloadArea{
  display:inline-block;
  width:700px;
  padding:0;
  background:#ffffff;
  border-radius:5px;
  overflow:hidden;
}
#downloadArea .table-header-bar{
  margin:0;
  max-width:none;
  width:100%;
}
#downloadArea table{
  margin:0;
  max-width:none;
  width:100%;
  box-shadow:none;
}
#downloadArea .watermark{
  margin:0;
  padding:10px 0;
  max-width:none;
  width:100%;
}
.total{
  background:#dee2e6;
  font-weight:bold;
}
.table-header-bar{
  background:#2f3e46;
  color:white;
  padding:14px 0;
  text-align:center;
  font-weight:800;
  font-size:20px;
  letter-spacing:0.5px;
  width:100%;
  max-width:700px;
  margin:30px auto 0;
  border-radius:6px 6px 0 0;
  box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

  font-size:13px;
  font-weight:600;
  margin-top:4px;

}
.loading-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.45);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:1000;
}
.loading-box{
  background:#fff;
  padding:24px 32px;
  border-radius:12px;
  text-align:center;
  font-weight:600;
  color:#062e44;
  max-width:420px;
}

  width:36px;

  margin:0 auto 12px;

button:disabled{ opacity:0.5; cursor:not-allowed !important; }

/* ===== EXPORT PAGES (used only for the downloaded image) =====

.export-cols{

<body>

<div class="header">
  <h2>SDD – Pendancy Report</h2>
</div>

<div id="loadingOverlay" class="loading-overlay">
  <div class="loading-box">
    <div class="spinner"></div>
    <div id="loadingText">Fetching store list from Google Sheet…</div>
  </div>
</div>

<button id="imgBtn" onclick="downloadImage()" style="
  margin:15px 0 15px 20px;
  padding:8px 16px;
  background:#062e44;
  color:white;
  border:none;

  cursor:pointer;
">
Download Report
</button>

<button id="csvBtn" onclick="downloadCSV()" style="
  margin:10px 0 15px 20px;
  padding:8px 16px;
  background:#0a5c36;
  color:white;
  border:none;
  border-radius:6px;
  cursor:pointer;
">
Download Filtered CSV
</button>

<div class="card">

<div class="upload-row">
  <div class="upload-box" style="flex:1 1 100%;">
    <label>Store List (published Google Sheet CSV link)</label>
    <div style="display:flex;gap:8px;">
      <input type="text" id="sheetUrl" style="flex:1;font-size:11px;padding:4px;">
      <button class="clear-btn" style="background:#062e44;margin-top:0;" onclick="loadStoreSheet()">Load / Refresh</button>
    </div>
    <div class="upload-status" id="sheetStatus">Store list not loaded</div>
  </div>
  <div class="upload-box">
    <label>Bolt Files (CSV / Excel)</label>
    <input type="file" id="boltFileInput" accept=".csv,.xlsx,.xls" multiple disabled>
    <div class="upload-hint">Select one or more files. New selections are added to the ones already loaded.</div>
    <div class="upload-status" id="boltStatus">No file loaded</div>
    <ul class="file-list" id="boltFileList"></ul>
    <button class="clear-btn" id="clearBtn" onclick="clearFiles()" style="display:none;">Clear all files</button>
  </div>
</div>

<div class="filter-box" id="filterBox"></div>

<div id="tableContainer"></div>
<div id="diagBox" class="diag-box" style="display:none;"></div>

</div>

<!-- Off-screen area where the downloadable image pages are built -->
<div id="exportHolder"></div>

<script>

/* ========================= CONFIG ========================= */

// Store list comes from the published Google Sheet ("Brand Pendancy" tab).
// Columns used: Stores (raw Warehouse Name), Rename (display name),
// Cutoff (time of day, e.g. 16:00:00). Only stores listed there are shown.
// Stores that share the same Rename are merged into one row group.
// If this link stops working, paste the correct one in the box on the page.
const DEFAULT_SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ0iMEN2NXUcFO1w5NpZ8-UvoaKSWsC9kLAb95lBsgG3VchCyzBSaIB4XT4BHUCVsXapsL3vIz-MegJ/pub?gid=1217247023&single=true&output=csv";

// Used only when a store's Cutoff cell is blank or unreadable.
const fallbackCutoffMinutes = 16 * 60;

const excludedBrands = ["testing_fabbox", "supertails"];

const statusesList = [
  "READY",
  "DELIVERED",
  "DELIVERY_ATTEMPTED",
  "PICKUP_COMPLETED",
  "PICKUP_PENDING",
  "PICKUP_IN_PROGRESS",
  "ALLOCATION_PENDING",
  "OUT_FOR_DELIVERY",
  "DELIVERY_IN_PROGRESS",
  "REACHED_DELIVERY"
];

// Downloaded image settings (always ONE image).
// A tall single-column table gets shrunk hard by WhatsApp and the numbers
// blur. So the image lays store blocks out in side-by-side columns, picking
// the column count that keeps the image close to EXPORT_TARGET_RATIO
// (height / width). Set EXPORT_COLUMNS to 1, 2 or 3 to force a count,
// or leave it as "auto".
const EXPORT_COLUMNS = "auto";
const EXPORT_MAX_COLUMNS = 3;
const EXPORT_TARGET_RATIO = 1.25;
// Render resolution multiplier. 3 = very sharp; it is lowered automatically
// only if the image would exceed the browser's canvas size limit.
const EXPORT_SCALE = 3;

/* ========================= STATE ========================= */

// fileName -> array of normalized rows. Re-uploading a file with the same
// name replaces its rows instead of double-counting them.
let loadedFiles = {};

// lowercase warehouse name -> { name, cutoffMinutes }
let storeConfig = {};
let storeConfigLoaded = false;

function allRows(){
  return Object.values(loadedFiles).flat();
}

/* ========================= STORE SHEET ========================= */

function getSheetUrl(){
  try{
    let saved = localStorage.getItem("sddSheetUrl_v2");
    if(saved) return saved;
  } catch(e){}
  return DEFAULT_SHEET_URL;
}

function storeKey(raw){
  return str(raw).toLowerCase().replace(/\s+/g, " ");
}

// "16:00:00", "16:00", "4:00 PM", or a sheet fraction like 0.6667 -> minutes
function parseCutoff(raw){
  let s = str(raw);
  if(!s) return null;
  if(/^\d*\.\d+$/.test(s)) return Math.round(parseFloat(s) * 1440);
  let t = parseTime(s);
  return t ? t.hour * 60 + t.minute : null;
}

function minutesLabel(m){
  return String(Math.floor(m / 60)).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
}

// Locks upload + download until the store list is in, so nobody can
// download an empty report while the sheet is still loading.
function setControlsEnabled(on){
  document.getElementById("boltFileInput").disabled = !on;
  document.getElementById("imgBtn").disabled = !on;
  document.getElementById("csvBtn").disabled = !on;
}

function showLoading(text){
  document.getElementById("loadingText").textContent = text;
  document.getElementById("loadingOverlay").style.display = "flex";
}
function hideLoading(){
  document.getElementById("loadingOverlay").style.display = "none";
}

async function fetchWithTimeout(url, ms){
  let ctrl = new AbortController();
  let timer = setTimeout(() => ctrl.abort(), ms);
  try{
    let res = await fetch(url, { signal: ctrl.signal, cache: "no-store" });
    if(!res.ok) throw new Error("HTTP " + res.status);
    return await res.text();
  } finally {
    clearTimeout(timer);
  }
}

function buildStoreConfig(csvText){
  let parsed = Papa.parse(csvText, { header: true, skipEmptyLines: true });
  let cfg = {};
  parsed.data.forEach(row=>{
    let lower = {};
    Object.keys(row).forEach(k => lower[k.trim().toLowerCase()] = row[k]);
    let key = storeKey(lower["stores"]);
    if(!key) return;
    let cutoff = parseCutoff(lower["cutoff"]);
    if(cutoff === null) cutoff = fallbackCutoffMinutes;
    cfg[key] = {
      name: str(lower["rename"]) || str(lower["stores"]),
      cutoffMinutes: cutoff
    };
  });
  return cfg;
}

let sheetLoading = false;

async function loadStoreSheet(){
  if(sheetLoading) return;
  sheetLoading = true;

  let input = document.getElementById("sheetUrl");
  let url = str(input.value) || DEFAULT_SHEET_URL;
  try{ localStorage.setItem("sddSheetUrl_v2", url); } catch(e){}

  let statusEl = document.getElementById("sheetStatus");
  statusEl.style.color = "#0a5c36";
  statusEl.textContent = "Loading store list...";
  setControlsEnabled(false);

  const maxTries = 3;
  let lastErr = null;

  for(let attempt = 1; attempt <= maxTries; attempt++){
    showLoading(`Fetching store list from Google Sheet… (attempt ${attempt} of ${maxTries}, can take up to ~10 sec)`);
    try{
      let fetchUrl = url + (url.includes("?") ? "&" : "?") + "_ts=" + Date.now();
      let text = await fetchWithTimeout(fetchUrl, 20000);
      if(/^\s*<(!doctype|html)/i.test(text)){
        throw new Error("Link returned a web page, not CSV. Use the 'Publish to web → CSV' link.");
      }
      let cfg = buildStoreConfig(text);
      if(Object.keys(cfg).length === 0){
        throw new Error("Sheet loaded but no stores found. It needs Stores / Rename / Cutoff columns.");
      }

      storeConfig = cfg;
      storeConfigLoaded = true;

      // Show each display name once, listing how many warehouses feed into it.
      let byName = {};
      Object.values(cfg).forEach(c=>{
        let k = c.name.toLowerCase();
        if(!byName[k]) byName[k] = { name: c.name, count: 0, cutoff: c.cutoffMinutes };
        byName[k].count++;
      });
      let names = Object.values(byName).map(b =>
        `${b.name}${b.count > 1 ? " ×" + b.count : ""} (${minutesLabel(b.cutoff)})`);
      statusEl.style.color = "#0a5c36";
      statusEl.textContent = `Loaded ${Object.keys(cfg).length} warehouses as ${names.length} darkstores: ${names.join(", ")}`;
      hideLoading();
      setControlsEnabled(true);
      sheetLoading = false;
      updateTable();
      return;
    } catch(err){
      lastErr = err;
      console.error("Store sheet attempt " + attempt + " failed:", err);
      if(attempt < maxTries) await new Promise(r => setTimeout(r, 1500));
    }
  }

  hideLoading();
  sheetLoading = false;
  statusEl.style.color = "#b00020";
  let reason = lastErr && lastErr.name === "AbortError" ? "timed out" : (lastErr ? lastErr.message : "unknown error");
  statusEl.textContent = `Could not load the store list (${reason}). Check the link and your internet, then click Load / Refresh. Upload and download stay locked until it loads.`;
}

/* ========================= HELPERS ========================= */

function prettifyStoreName(raw){
  let cfg = storeConfig[storeKey(raw)];
  return cfg ? cfg.name : raw;
}

function str(v){
  if(v === null || v === undefined) return "";
  return String(v).trim();
}

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  })[c]);
}

// Excel serial date (days since 1899-12-30) -> {y,m,d,frac}
function excelSerialToParts(serial){
  let days = Math.floor(serial);
  let frac = serial - days;
  let ms = Date.UTC(1899, 11, 30) + days * 86400000;
  let dt = new Date(ms);
  return { y: dt.getUTCFullYear(), m: dt.getUTCMonth(), d: dt.getUTCDate(), frac };
}

// Returns {hour, minute} from a time value: Excel fraction, "14:35",
// "14:35:00", or "2:35 PM".
function parseTime(raw){
  if(typeof raw === "number"){
    let mins = Math.round((raw - Math.floor(raw)) * 1440);
    return { hour: Math.floor(mins / 60) % 24, minute: mins % 60 };
  }
  raw = str(raw);
  if(!raw) return null;
  let m = raw.match(/(\d{1,2}):(\d{2})(?::\d{2})?\s*(AM|PM)?/i);
  if(!m) return null;
  let hour = parseInt(m[1]);
  let minute = parseInt(m[2]);
  let ampm = (m[3] || "").toUpperCase();
  if(ampm === "PM" && hour !== 12) hour += 12;
  if(ampm === "AM" && hour === 12) hour = 0;
  return { hour, minute };
}

// Bolt: Creation Date = MM/DD/YYYY (or YYYY-MM-DD, or Excel serial),
// Creation Time = HH:MM (24h, AM/PM, or Excel fraction)
function parseBoltDate(dateRaw, timeRaw){
  let y, mo, d, time = null;

  if(typeof dateRaw === "number"){
    let p = excelSerialToParts(dateRaw);
    y = p.y; mo = p.m; d = p.d;
    if(p.frac > 0) time = parseTime(dateRaw);
  } else {
    let s = str(dateRaw);
    if(!s) return null;
    let iso = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if(iso){
      y = parseInt(iso[1]); mo = parseInt(iso[2]) - 1; d = parseInt(iso[3]);
    } else {
      let dp = s.split(/[\/\s]/);
      if(dp.length < 3) return null;
      mo = parseInt(dp[0]) - 1;
      d = parseInt(dp[1]);
      y = parseInt(dp[2]);
      if(y < 100) y += 2000;
    }
    time = parseTime(s.replace(/^\S+\s*/, "")) || null;
  }

  let t = parseTime(timeRaw) || time || { hour: 0, minute: 0 };
  let dt = new Date(y, mo, d, t.hour, t.minute);
  return isNaN(dt.getTime()) ? null : dt;
}

function normalizeBoltRow(row, fileName){
  return {
    sourceFile: fileName,
    store: str(row["Warehouse Name"]),
    awb: str(row["Zippee AWB"]),
    orderNumber: str(row["Order Number"]),
    brand: str(row["Brand Name"]).toLowerCase(),
    trip: str(row["Trip Code"]),
    attempts: parseInt(row["Total Attempt Count"]) || 0,
    status: str(row["Current Status"]).toUpperCase(),
    creationDate: parseBoltDate(row["Creation Date"], row["Creation Time"]),
    customerName: str(row["Customer Name"]),
    customerMobile: str(row["Customer Mobile"]),
    deliveryAddress: str(row["Delivery Address"]),
    deliveryPincode: str(row["Delivery Pincode"]),
    riderName: str(row["Rider Name"])
  };
}

// Shared filter used by both the table and the CSV export.
// Cutoff is still checked per warehouse, even when several warehouses
// are merged under one display name.
function passesFilters(nrow, includeTrips){
  if(!nrow.store) return false;
  let cfg = storeConfig[storeKey(nrow.store)];
  if(!cfg) return false;                       // only stores listed in the sheet
  if(excludedBrands.includes(nrow.brand)) return false;
  if(!includeTrips && nrow.trip !== "") return false;
  if(nrow.attempts > 3) return false;
  if(!nrow.awb) return false;
  if(nrow.status === "RTO") return false;

  // Orders created today after the store's cutoff time are excluded.
  if(nrow.creationDate){
    let now = new Date();
    let isToday =
      nrow.creationDate.getDate() === now.getDate() &&
      nrow.creationDate.getMonth() === now.getMonth() &&
      nrow.creationDate.getFullYear() === now.getFullYear();
    let createdMinutes = nrow.creationDate.getHours() * 60 + nrow.creationDate.getMinutes();
    if(isToday && createdMinutes > cfg.cutoffMinutes) return false;
  }

  return true;
}

// Filters + dedupes by AWB across all loaded files (keeps the row with the
// highest attempt count per AWB).
function getFilteredDeduped(){
  let includeTrips = document.getElementById("tripToggle")?.checked || false;
  let latestMap = {};
  allRows().forEach(nrow=>{
    if(!passesFilters(nrow, includeTrips)) return;
    if(!latestMap[nrow.awb] || nrow.attempts > latestMap[nrow.awb].attempts){
      latestMap[nrow.awb] = nrow;
    }
  });
  return Object.values(latestMap);
}

/* ========================= FILE HANDLING ========================= */

function readCSV(file){
  return new Promise((resolve, reject)=>{
    Papa.parse(file, {
      header: true,
      skipEmptyLines: true,
      complete: res => resolve(res.data),
      error: err => reject(err)
    });
  });
}

function readExcel(file){
  return new Promise((resolve, reject)=>{
    let reader = new FileReader();
    reader.onload = e => {
      try{
        let wb = XLSX.read(new Uint8Array(e.target.result), { type: "array" });
        let rows = [];
        wb.SheetNames.forEach(name=>{
          let sheetRows = XLSX.utils.sheet_to_json(wb.Sheets[name], { raw: true, defval: "" });
          rows = rows.concat(sheetRows);
        });
        resolve(rows);
      } catch(err){ reject(err); }
    };
    reader.onerror = () => reject(reader.error);
    reader.readAsArrayBuffer(file);
  });
}

function readAnyFile(file){
  let name = file.name.toLowerCase();
  if(name.endsWith(".xlsx") || name.endsWith(".xls")) return readExcel(file);
  return readCSV(file);
}

document.getElementById("boltFileInput").addEventListener("change", async function(e){
  let files = Array.from(e.target.files || []);
  if(!files.length) return;

  let statusEl = document.getElementById("boltStatus");
  statusEl.style.color = "#0a5c36";
  statusEl.textContent = `Reading ${files.length} file(s)...`;

  let errors = [];
  await Promise.all(files.map(async file=>{
    try{
      let raw = await readAnyFile(file);
      loadedFiles[file.name] = raw.map(r => normalizeBoltRow(r, file.name));
    } catch(err){
      errors.push(file.name);
      console.error("Failed to read", file.name, err);
    }
  }));

  e.target.value = ""; // allow re-selecting the same file later
  refreshFileUI(errors);
  updateTable();
});

function refreshFileUI(errors){
  let names = Object.keys(loadedFiles);
  let total = allRows().length;
  let statusEl = document.getElementById("boltStatus");

  if(names.length === 0){
    statusEl.textContent = "No file loaded";
  } else {
    statusEl.textContent = `Loaded ${names.length} file(s), ${total} rows total`;
  }
  if(errors && errors.length){
    statusEl.style.color = "#b00020";
    statusEl.textContent += ` — could not read: ${errors.join(", ")}`;
  } else {
    statusEl.style.color = "#0a5c36";
  }

  document.getElementById("boltFileList").innerHTML = names.map(n=>`
    <li><span>${esc(n)} (${loadedFiles[n].length} rows)</span>
    <button onclick="removeFile(${JSON.stringify(n).replace(/"/g,'&quot;')})">✕</button></li>
  `).join("");

  document.getElementById("clearBtn").style.display = names.length ? "inline-block" : "none";
}

function removeFile(name){
  delete loadedFiles[name];
  refreshFileUI();
  updateTable();
}

function clearFiles(){
  loadedFiles = {};
  refreshFileUI();
  updateTable();
}

/* ========================= FILTER UI ========================= */

function createFilter(){
  let html = `
  <b>Trip Filter:</b><br>
  <label>
    <input type="checkbox" id="tripToggle" onchange="updateTable()">
    Include Trip Orders
  </label><br><br>
  <b>Status Filter:</b><br>
  `;

  statusesList.forEach(s=>{
    html += `<label>
      <input type="checkbox" value="${s}" ${s==="READY"?"checked":""}
      onchange="updateTable()"> ${s}
    </label>`;
  });

  document.getElementById("filterBox").innerHTML = html;
}

function getSelectedStatuses(){
  let selected = [];
  document.querySelectorAll('#filterBox input[type="checkbox"][value]:checked')
    .forEach(cb => selected.push(cb.value));
  return selected;
}

function updateTable(){
  renderTable(getSelectedStatuses());
}

/* ========================= REPORT MODEL ========================= */

// e.g. "02 Nov 2026, 03:20 PM"
function reportTimestamp(){
  return new Date().toLocaleString("en-IN", {
    day: "2-digit", month: "short", year: "numeric",
    hour: "2-digit", minute: "2-digit", hour12: true
  }).replace(/\b(am|pm)\b/, m => m.toUpperCase());
}

// Groups orders by DISPLAY name (the sheet's Rename column), so every
// warehouse that shares a Rename lands in one block.
function buildModel(statuses){
  let deduped = getFilteredDeduped();

  // displayKey -> { name, attempts: { n: { status: count } } }
  let grouped = {};
  deduped.forEach(nrow=>{
    let name = prettifyStoreName(nrow.store);
    let key = name.toLowerCase();
    if(!grouped[key]) grouped[key] = { name, attempts: {} };
    let att = grouped[key].attempts;
    if(!att[nrow.attempts]) att[nrow.attempts] = {};
    att[nrow.attempts][nrow.status] = (att[nrow.attempts][nrow.status] || 0) + 1;
  });

  let gTotal = statuses.map(() => 0);
  let grand = 0;
  let blocks = [];

  Object.values(grouped)
    .sort((a,b) => a.name.localeCompare(b.name))
    .forEach(g=>{
      let rows = Object.keys(g.attempts)
        .map(Number)
        .sort((a,b) => a - b)
        .map(attempt=>{
          let vals = statuses.map(s => g.attempts[attempt][s] || 0);
          return { attempt, vals, total: vals.reduce((a,b) => a + b, 0) };
        })
        .filter(r => r.total > 0);

      if(!rows.length) return;

      let sub = statuses.map((_, i) => rows.reduce((sum, r) => sum + r.vals[i], 0));
      let total = sub.reduce((a,b) => a + b, 0);
      sub.forEach((v, i) => gTotal[i] += v);
      grand += total;
      blocks.push({ name: g.name, rows, sub, total });
    });

  return { statuses, blocks, gTotal, grand };
}

function headerHTML(model, ts){
  return `
  <div class="table-header-bar">
    Zippee &lt;&gt; PAN INDIA Pendency Report
    <div class="sub">${ts} &nbsp;|&nbsp; Total Pendency: ${model.grand}</div>
  </div>`;
}

// One table. Each store block is its own <tbody> so its height can be measured.
function tableHTML(model, blocks, showGrand){
  let s = model.statuses;
  // The Total column only adds information when 2+ statuses are ticked.
  let showTotal = s.length > 1;
  let totalCell = v => showTotal ? `<td>${v}</td>` : "";
  let h = `
  <table>
    <thead><tr>
      <th>Darkstore</th>
      <th>No. of Attempts</th>
      ${s.map(x => `<th>${x.replace(/_/g, "_<wbr>")}</th>`).join("")}
      ${showTotal ? "<th>Total</th>" : ""}
    </tr></thead>`;

  blocks.forEach(b=>{
    h += `<tbody class="store-block">`;
    b.rows.forEach((r, i)=>{
      h += "<tr>";
      if(i === 0) h += `<td rowspan="${b.rows.length}" class="store">${esc(b.name)}</td>`;
      h += `<td><b>${r.attempt} Attempts</b></td>`;
      h += r.vals.map(v => `<td>${v}</td>`).join("");
      h += `${totalCell(r.total)}</tr>`;
    });
    h += `<tr class="subtotal"><td colspan="2">Subtotal</td>
      ${b.sub.map(v => `<td>${v}</td>`).join("")}
      ${totalCell(b.total)}</tr></tbody>`;
  });

  if(showGrand){
    h += `<tbody><tr class="total"><td colspan="2"><b>Total</b></td>
      ${model.gTotal.map(v => `<td>${v}</td>`).join("")}
      ${totalCell(model.grand)}</tr></tbody>`;
  }
  return h + `</table>`;
}

const WATERMARK_HTML = `<div class="watermark">Powered by SASA Automation | Zippee</div>`;

/* ========================= RENDER ========================= */

function renderTable(statuses){
  let model = buildModel(statuses);
  document.getElementById("tableContainer").innerHTML =
    `<div id="downloadArea">${headerHTML(model, reportTimestamp())}${tableHTML(model, model.blocks, true)}${WATERMARK_HTML}</div>`;
  renderDiagnostics(model.grand);
}

// When the report comes out empty, explain why instead of showing just 0.
function renderDiagnostics(grand){
  let box = document.getElementById("diagBox");
  let rows = allRows();

  if(!storeConfigLoaded){
    box.style.display = "block";
    box.innerHTML = "<b>Store list not loaded yet.</b> Wait for it to finish, or click Load / Refresh.";
    return;
  }
  if(rows.length === 0 || grand > 0){
    box.style.display = "none";
    return;
  }

  let includeTrips = document.getElementById("tripToggle")?.checked || false;
  let unmatched = {};
  let c = { matched:0, trip:0, attempts:0, rto:0, cutoff:0, brand:0, noAwb:0 };
  let now = new Date();

  rows.forEach(r=>{
    let cfg = storeConfig[storeKey(r.store)];
    if(!cfg){ if(r.store) unmatched[r.store] = (unmatched[r.store] || 0) + 1; return; }
    c.matched++;
    if(excludedBrands.includes(r.brand)) c.brand++;
    else if(!includeTrips && r.trip !== "") c.trip++;
    else if(r.attempts > 3) c.attempts++;
    else if(!r.awb) c.noAwb++;
    else if(r.status === "RTO") c.rto++;
    else if(r.creationDate && r.creationDate.toDateString() === now.toDateString() &&
            r.creationDate.getHours()*60 + r.creationDate.getMinutes() > cfg.cutoffMinutes) c.cutoff++;
  });

  let top = Object.entries(unmatched).sort((a,b)=>b[1]-a[1]).slice(0,10)
    .map(([k,v]) => `${esc(k)} (${v})`).join(", ");

  box.style.display = "block";
  box.innerHTML = `<b>No orders matched.</b> Of ${rows.length} uploaded rows:<br>
    • ${c.matched} belong to stores in the sheet<br>
    • ${c.trip} removed as trip orders (tick "Include Trip Orders" to keep them)<br>
    • ${c.cutoff} removed as created today after cutoff<br>
    • ${c.attempts} removed for more than 3 attempts, ${c.rto} RTO, ${c.brand} excluded brand, ${c.noAwb} missing AWB<br>
    • Rest have a status not ticked above<br>
    ${top ? `<br>Warehouse names in your files that are <b>not</b> in the sheet: ${top}` : ""}`;
}

/* ========================= EXPORTS ========================= */

function readyToDownload(){
  if(!storeConfigLoaded){
    alert("Store list is still loading. Please wait a few seconds and try again.");
    return false;
  }
  if(allRows().length === 0){
    alert("Upload at least one Bolt file first.");
    return false;
  }
  return true;
}

// Splits blocks (in order) into k columns of roughly equal height.
// A store block is never split between columns.
function splitIntoColumns(blocks, heights, k){
  let total = heights.reduce((x, y) => x + y, 0);
  let cols = [];
  let cur = [], curH = 0, done = 0;
  blocks.forEach((b, i)=>{
    let colsLeft = k - cols.length;
    let target = (total - done) / colsLeft;
    let h = heights[i];
    // Start a new column when adding this block overshoots the target more
    // than stopping short would, as long as columns remain.
    if(cur.length && colsLeft > 1 && curH + h - target > target - curH){
      cols.push(cur);
      done += curH;
      cur = []; curH = 0;
    }
    cur.push(b);
    curH += h;
  });
  cols.push(cur);
  return cols;
}

function exportLayoutHTML(model, cols, ts, colWidth, gap){
  let width = cols.length * colWidth + (cols.length + 1) * gap;
  return `
  <div class="export-page" style="width:${width}px">
    ${headerHTML(model, ts)}
    <div class="export-cols" style="gap:${gap}px;padding:${gap}px;">
      ${cols.map((c, i) => `<div class="export-col">${tableHTML(model, c, i === cols.length - 1)}</div>`).join("")}
    </div>
    ${WATERMARK_HTML}
  </div>`;
}

let exporting = false;

async function downloadImage(){
  if(exporting || !readyToDownload()) return;
  exporting = true;

  let btn = document.getElementById("imgBtn");
  btn.disabled = true;
  btn.textContent = "Preparing image…";
  let holder = document.getElementById("exportHolder");

  try{
    updateTable();
    let model = buildModel(getSelectedStatuses());
    let ts = reportTimestamp();
    let gap = 28;
    let colWidth = Math.max(720, 400 + (model.statuses.length + (model.statuses.length > 1 ? 1 : 0)) * 160);

    // 1) Render as a single column to measure each store block's height.
    holder.innerHTML = exportLayoutHTML(model, [model.blocks], ts, colWidth, gap);
    let heights = Array.from(holder.querySelectorAll(".store-block")).map(el => el.offsetHeight);
    let page = holder.firstElementChild;
    let tableEl = page.querySelector("table");
    let fixedH = page.offsetHeight - tableEl.offsetHeight;   // header + padding + footer
    let headRowH = tableEl.querySelector("thead").offsetHeight;
    let grandH = tableEl.offsetHeight - headRowH - heights.reduce((x, y) => x + y, 0);

    // 2) Pick the column count.
    let k;
    if(EXPORT_COLUMNS !== "auto"){
      k = Math.max(1, Math.min(parseInt(EXPORT_COLUMNS) || 1, model.blocks.length || 1));
    } else {
      let best = Infinity;
      k = 1;
      for(let c = 1; c <= Math.min(EXPORT_MAX_COLUMNS, Math.max(1, model.blocks.length)); c++){
        let cols = splitIntoColumns(model.blocks, heights, c);
        let idx = 0;
        let tallest = Math.max(...cols.map((col, ci)=>{
          let h = headRowH + col.reduce((sum) => sum + heights[idx++], 0);
          return ci === cols.length - 1 ? h + grandH : h;
        }));
        let w = c * colWidth + (c + 1) * gap;
        let ratio = (fixedH + tallest) / w;
        let score = Math.abs(Math.log(ratio / EXPORT_TARGET_RATIO));
        if(score < best){ best = score; k = c; }
      }
    }

    // 3) Render the final single image.
    let cols = splitIntoColumns(model.blocks, heights, k);
    holder.innerHTML = exportLayoutHTML(model, cols, ts, colWidth, gap);
    page = holder.firstElementChild;

    // Highest resolution the browser can safely draw (Chrome caps a canvas
    // at ~16k px per side and ~268M pixels in total).
    let w = page.offsetWidth, h = page.offsetHeight;
    let scale = Math.min(
      EXPORT_SCALE,
      16000 / Math.max(w, h),
      Math.sqrt(250e6 / (w * h))
    );

    let canvas = await html2canvas(page, {
      scale,
      backgroundColor: "#ffffff",
      useCORS: true,
      scrollX: 0,
      scrollY: -window.scrollY
    });

    let blob = await new Promise(r => canvas.toBlob(r, "image/png"));
    let link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `Pendency_${ts.replace(/[^\w]+/g, "_")}.png`;
    link.click();
    setTimeout(() => URL.revokeObjectURL(link.href), 10000);
  } catch(err){
    console.error(err);
    alert("Could not create the image: " + err.message);
  } finally {
    holder.innerHTML = "";
    exporting = false;
    btn.disabled = false;
    btn.textContent = "Download Report";
  }
}

function downloadCSV(){
  if(!readyToDownload()) return;
  let selectedStatuses = getSelectedStatuses();

  let deduped = getFilteredDeduped()
    .filter(nrow => selectedStatuses.includes(nrow.status));

  let exportRows = deduped.map(nrow => ({
    "Source File": nrow.sourceFile,
    "Darkstore": prettifyStoreName(nrow.store),
    "Raw Warehouse Value": nrow.store,
    "AWB": nrow.awb,
    "Order Number": nrow.orderNumber,
    "Brand": nrow.brand,
    "Trip": nrow.trip,
    "Attempts": nrow.attempts,
    "Status": nrow.status,
    "Creation Date": nrow.creationDate ? nrow.creationDate.toLocaleString() : "",
    "Customer Name": nrow.customerName,
    "Customer Mobile": nrow.customerMobile,
    "Delivery Address": nrow.deliveryAddress,
    "Delivery Pincode": nrow.deliveryPincode,
    "Rider Name": nrow.riderName
  }));

  let csv = Papa.unparse(exportRows);
  let blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  let link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "filtered_data.csv";
  link.click();
}

document.getElementById("sheetUrl").value = getSheetUrl();
