<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SDD PAN India Pendency</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<style>
body{
  margin:0;
  font-family:"Segoe UI";
  background:url('Zippee.png') center/cover fixed no-repeat;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:rgba(255,255,255,.2);
  backdrop-filter:blur(6px);
  z-index:-1;
}

/* HEADER */
.header{
  background:linear-gradient(90deg,rgba(0,63,140,.85),rgba(0,89,179,.85));
  color:white;
  padding:18px 36px;
}

/* CARD */
.card{
  background:rgba(255,255,255,0.16);
  backdrop-filter:blur(10px);
  margin:40px auto;
  width:fit-content;           /* dynamic width */
  min-width:700px;             /* fallback */
  padding:30px;
  border-radius:18px;
  text-align:left;
  box-sizing:border-box;
}

/* UPLOAD ROW */
.upload-row{
  display:flex;
  gap:24px;
  flex-wrap:wrap;
  margin-bottom:10px;
}
.upload-box{
  background:rgba(255,255,255,0.55);
  border:1px dashed #062e44;
  border-radius:10px;
  padding:12px 16px;
  min-width:260px;
}
.upload-box label{
  display:block;
  font-weight:700;
  font-size:13px;
  color:#062e44;
  margin-bottom:6px;
}
.upload-status{
  font-size:11px;
  margin-top:6px;
  color:#0a5c36;
  font-weight:600;
}

/* FILTER */
.filter-box{
  margin-top:15px;
}

/* TABLE */
table{
  width:100%;
  max-width:700px;
  margin:auto;
  border-collapse:collapse;
  border-radius:0 0 6px 6px;
  overflow:hidden;
  box-shadow:0 8px 20px rgba(0,0,0,0.2);
}

th,td{
  border:1px solid #ddd;
  padding:6px;
  font-size:12px;
  text-align:center;
}

th{
  background:#062e44;
  color:white;
}
#downloadArea{
  display:inline-block;
  width:700px;
  padding:0;
  background:#ffffff;
  border-radius:5px;
  overflow:hidden;
}
#downloadArea .table-header-bar{
  margin:0;
  max-width:none;
  width:100%;
}
#downloadArea table{
  margin:0;
  max-width:none;
  width:100%;
  box-shadow:none;
}
#downloadArea .watermark{
  margin:0;
  padding:10px 0;
  max-width:none;
  width:100%;
}
.total{
  background:#dee2e6;
  font-weight:bold;
}
th,td{
  padding:5px 6px;
  font-size:12px;
}
.table-header-bar{
  background:#2f3e46;
  color:white;
  padding:14px 0;
  text-align:center;
  font-weight:800;
  font-size:18px;
  font-size:20px;
  letter-spacing:0.5px;
  width:100%;
  max-width:700px;
  margin:30px auto 0;

  border-radius:6px 6px 0 0;
  box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

.watermark{
  width:100%;
  max-width:700px;
  margin:10px auto 30px;
  text-align:center;
  font-weight:bold;
}
.source-tag{
  display:inline-block;
  font-size:9px;
  font-weight:700;
  padding:1px 5px;
  border-radius:4px;
  margin-left:4px;
  vertical-align:middle;
}
.source-blaze{ background:#ffe08a; color:#5c4300; }
.source-bolt{ background:#b7e4c7; color:#0a3d20; }
</style>

</head>

<body>

<div class="header">
  <h2>SDD – Pendancy Report</h2>
</div>

<button onclick="downloadImage()" style="
  margin:15px 0 15px 20px;
  padding:8px 16px;
  background:#062e44;
  color:white;
  border:none;
  border-radius:6px;
  cursor:pointer;
">
Download Report
</button>

<button onclick="downloadCSV()" style="
  margin:10px 0 15px 20px;
  padding:8px 16px;
  background:#0a5c36;
  color:white;
  border:none;
  border-radius:6px;
  cursor:pointer;
">
Download Filtered CSV
</button>

<div class="card">

<div class="upload-row">
  <div class="upload-box">
    <label>Blaze File (legacy format)</label>
    <input type="file" id="blazeFileInput" accept=".csv">
    <div class="upload-status" id="blazeStatus">No file loaded</div>
  </div>
  <div class="upload-box">
    <label>Bolt File (new format)</label>
    <input type="file" id="boltFileInput" accept=".csv">
    <div class="upload-status" id="boltStatus">No file loaded</div>
  </div>
</div>

<div class="filter-box" id="filterBox"></div>

<div id="tableContainer"></div>

</div>

<script>

/* ========================= CONFIG ========================= */

// Fixed Blaze darkstore whitelist (unchanged from the original report)
const blazeAllowedStores = [
  "zippee_andheri_sdd",
  "zippee_horamavu_sdd",
  "zippee_okhla_sdd",
  "zippee_koramangala_sdd",
  "zippee_koregaonpark_sdd",
  "zippee_manikonda_sdd",
  "zippee_matunga_valkyriesdd",
  "zippee_periyamet_sdd",
  "zippee_kolkata_sdd",
  "zippee_ghaziabad_sdd",
  "zippee_wazirpur_sdd",
  "zippee_dwarka_sdd",
  "zippee_gurugram_sdd",
  "zipppee_noida_sdd"
];

// Display names for known store slugs (Blaze slugs, plus any Bolt slugs
// you want to alias later). Anything not listed here falls back to a
// prettified version of the raw warehouse name.
const storeNameMap = {
  "zippee_andheri_sdd": "Mumbai | Andheri",
  "zippee_horamavu_sdd": "Bangalore | Horamavu",
  "zippee_okhla_sdd": "Delhi | Okhla",
  "zippee_ghaziabad_sdd": "Delhi | Ghaziabad",
  "zippee_wazirpur_sdd": "Delhi | Wazirpur",
  "zippee_dwarka_sdd": "Delhi | Dwarka",
  "zippee_gurugram_sdd": "Delhi | Gurugram",
  "zipppee_noida_sdd": "Delhi | Noida",
  "zippee_koramangala_sdd": "Bangalore | Koramangala",
  "zippee_koregaonpark_sdd": "Pune | Koregaon Park",
  "zippee_manikonda_sdd": "Hyderabad | Manikonda",
  "zippee_matunga_valkyriesdd": "Mumbai | Matunga",
  "zippee_periyamet_sdd": "Chennai | Periyamet",
    "zippee_periyamet_sdd": "Chennai | Periyamet",
  "zippee_kolkata_sdd": "Kolkata | Topsia",
  "zippee_topsia_valkyriesdd": "Kolkata | Topsia",
  "zippee_krishna_herbal_indorewh": "Indore | Krishna Herbal",
  "zippee_krishna_herbal_jodhpurwh": "Jodhpur | Krishna Herbal"
};

// Only these Bolt warehouses are included in the report. Everything else
// in a Bolt upload (test stores, other clients' warehouses, etc.) is
// excluded. Add/remove slugs here as needed.
// Only these Bolt warehouses are included in the report. Everything else
// in a Bolt upload (test stores, other clients' warehouses, etc.) is
// excluded. Add/remove slugs here as needed.
const boltAllowedStores = [
  "zippee_krishna_herbal_indorewh",
  "zippee_krishna_herbal_jodhpurwh",
  "zippee_periyamet_sdd",
  "zippee_topsia_valkyriesdd",
  "zippee_periyamet_sdd",
  "healthkart-ludhiana",
  "zippee_topsia_valkyriesdd",
"zippee_periyamet_sdd",
"zippee_koramangala_sdd",
"zippee_horamavu_sdd",
"zippee_manikonda_sdd",
"zippee_kalyannagar_sdd"
];

// Same-day cutoff hour (24h) per store. Any order created today, after
// this hour, is excluded from pendency. Default is 3pm; override specific
// stores below.
const defaultCutoffHour = 15;
const storeCutoffHours = {
  "zippee_krishna_herbal_indorewh": 11,
  "zippee_krishna_herbal_jodhpurwh": 11
};

// Brands excluded regardless of source. Bolt data also contains obvious
// test brands (Test_onprod, Test locus, Moksh_Test) — not excluded by
// default since you didn't ask for that; add them below if you want them out.
const excludedBrands = ["testing_fabbox", "supertails"];

const statusesList = [
  "READY",
  "DELIVERED",
  "DELIVERY_ATTEMPTED",
  "PICKUP_COMPLETED",
  "PICKUP_PENDING",
  "PICKUP_IN_PROGRESS",
  "ALLOCATION_PENDING",
  "OUT_FOR_DELIVERY",
  "DELIVERY_IN_PROGRESS",
  "REACHED_DELIVERY"
];

/* ========================= STATE ========================= */

let blazeNormalized = [];
let boltNormalized = [];

/* ========================= HELPERS ========================= */

function prettifyStoreName(raw){
  if(storeNameMap[raw]) return storeNameMap[raw];
  return raw
    .replace(/_/g, " ")
    .replace(/\b\w/g, c => c.toUpperCase());
}

// Blaze: single field like ="17/08/2026 5:16 PM" -> dd/mm/yyyy hh:mm AM/PM
function parseBlazeDate(raw){
  raw = (raw || "").trim().replace(/^="|"$/g, "");
  if(!raw) return null;
  let parts = raw.split(/[\s/:]/);
  if(parts.length < 6) return null;
  let day = parseInt(parts[0]);
  let month = parseInt(parts[1]) - 1;
  let year = parseInt(parts[2]);
  let hour = parseInt(parts[3]);
  let minute = parseInt(parts[4]);
  let ampm = parts[5];
  if(ampm === "PM" && hour !== 12) hour += 12;
  if(ampm === "AM" && hour === 12) hour = 0;
  let d = new Date(year, month, day, hour, minute);
  return isNaN(d.getTime()) ? null : d;
}

// Bolt: separate fields, Creation Date = MM/DD/YYYY, Creation Time = HH:MM (24h)
function parseBoltDate(dateRaw, timeRaw){
  dateRaw = (dateRaw || "").trim();
  if(!dateRaw) return null;
  let dparts = dateRaw.split("/");
  if(dparts.length < 3) return null;
  let month = parseInt(dparts[0]) - 1;
  let day = parseInt(dparts[1]);
  let year = parseInt(dparts[2]);
  let hour = 0, minute = 0;
  if(timeRaw){
    let tparts = timeRaw.trim().split(":");
    hour = parseInt(tparts[0]) || 0;
    minute = parseInt(tparts[1]) || 0;
  }
  let d = new Date(year, month, day, hour, minute);
  return isNaN(d.getTime()) ? null : d;
}

function normalizeBlazeRow(row){
  return {
    source: "blaze",
    store: (row["Darkstore"] || "").trim(),
    awb: (row["AWB Number"] || "").trim(),
    orderNumber: (row["Order Number"] || "").trim(),
    brand: (row["Brand Name"] || "").trim().toLowerCase(),
    trip: (row["Trip ID"] || "").toString().trim(),
    attempts: parseInt(row["No. of Attempts"]) || 0,
    status: (row["Current Status"] || "").trim().toUpperCase(),
    creationDate: parseBlazeDate(row["Creation Date"]),
    customerName: (row["Customer Name"] || "").trim(),
    customerMobile: (row["Customer Mobile"] || "").trim(),
    deliveryAddress: (row["Delivery Address"] || "").trim(),
    deliveryPincode: (row["Delivery Pincode"] || "").trim(),
    riderName: (row["Rider Name"] || "").trim()
  };
}

function normalizeBoltRow(row){
  return {
    source: "bolt",
    store: (row["Warehouse Name"] || "").trim(),
    awb: (row["Zippee AWB"] || "").trim(),
    orderNumber: (row["Order Number"] || "").trim(),
    brand: (row["Brand Name"] || "").trim().toLowerCase(),
    trip: (row["Trip Code"] || "").toString().trim(),
    attempts: parseInt(row["Total Attempt Count"]) || 0,
    status: (row["Current Status"] || "").trim().toUpperCase(),
    creationDate: parseBoltDate(row["Creation Date"], row["Creation Time"]),
    customerName: (row["Customer Name"] || "").trim(),
    customerMobile: (row["Customer Mobile"] || "").trim(),
    deliveryAddress: (row["Delivery Address"] || "").trim(),
    deliveryPincode: (row["Delivery Pincode"] || "").trim(),
    riderName: (row["Rider Name"] || "").trim()
  };
}

// Single shared filter, used by both the table and the CSV export so
// they can never disagree with each other.
function passesFilters(nrow, includeTrips){
  if(!nrow.store) return false;

  if(nrow.source === "blaze" && !blazeAllowedStores.includes(nrow.store)) return false;
  if(nrow.source === "bolt" && !boltAllowedStores.includes(nrow.store)) return false;

  if(excludedBrands.includes(nrow.brand)) return false;

  if(!includeTrips && nrow.trip !== "") return false;

  if(nrow.attempts > 3) return false;
  if(!nrow.awb) return false;
  if(nrow.status === "RTO") return false;

  if(nrow.creationDate){
    let now = new Date();
    let isToday =
      nrow.creationDate.getDate() === now.getDate() &&
      nrow.creationDate.getMonth() === now.getMonth() &&
      nrow.creationDate.getFullYear() === now.getFullYear();
    let cutoffHour = storeCutoffHours[nrow.store] ?? defaultCutoffHour;
    let cutoff = new Date(now.getFullYear(), now.getMonth(), now.getDate(), cutoffHour, 0, 0);
    if(isToday && nrow.creationDate > cutoff) return false;
  }

  return true;
}

// Filters + dedupes by AWB (keeps the row with the highest attempt count
// per AWB, across both sources combined). This replaces the old
// `awb + "_" + Math.random()` key, which never actually deduplicated.
function getFilteredDeduped(){
  let includeTrips = document.getElementById("tripToggle")?.checked || false;
  let combined = blazeNormalized.concat(boltNormalized);

  let latestMap = {};
  combined.forEach(nrow=>{
    if(!passesFilters(nrow, includeTrips)) return;
    if(!latestMap[nrow.awb] || nrow.attempts > latestMap[nrow.awb].attempts){
      latestMap[nrow.awb] = nrow;
    }
  });

  return Object.values(latestMap);
}

/* ========================= FILE HANDLING ========================= */

document.getElementById("blazeFileInput").addEventListener("change", function(e){
  if(!e.target.files[0]) return;
  Papa.parse(e.target.files[0], {
    header: true,
    skipEmptyLines: true,
    complete: function(res){
      blazeNormalized = res.data.map(normalizeBlazeRow);
      document.getElementById("blazeStatus").textContent =
        `Loaded ${blazeNormalized.length} rows`;
      renderTable(getSelectedStatuses());
    }
  });
});

document.getElementById("boltFileInput").addEventListener("change", function(e){
  if(!e.target.files[0]) return;
  Papa.parse(e.target.files[0], {
    header: true,
    skipEmptyLines: true,
    complete: function(res){
      boltNormalized = res.data.map(normalizeBoltRow);
      document.getElementById("boltStatus").textContent =
        `Loaded ${boltNormalized.length} rows`;
      renderTable(getSelectedStatuses());
    }
  });
});

/* ========================= FILTER UI ========================= */

function createFilter(){
  let html = "<b>Status Filter:</b><br>";

  html += `
  <br><b>Trip Filter:</b><br>
  <label>
    <input type="checkbox" id="tripToggle" onchange="updateTable()">
    Include Trip Orders
  </label><br><br>
  `;

  statusesList.forEach(s=>{
    html += `<label>
      <input type="checkbox" value="${s}" ${s==="READY"?"checked":""}
      onchange="updateTable()"> ${s}
    </label>`;
  });

  document.getElementById("filterBox").innerHTML = html;
}

function getSelectedStatuses(){
  let selected = [];
  document.querySelectorAll('#filterBox input[type="checkbox"][value]:checked')
    .forEach(cb => selected.push(cb.value));
  return selected;
}

function updateTable(){
  renderTable(getSelectedStatuses());
}

/* ========================= RENDER ========================= */

function renderTable(statuses){

  let deduped = getFilteredDeduped();

  // Build pivot: store|attempts -> status -> count
  let pivot = {};
  deduped.forEach(nrow=>{
    let key = nrow.store + "|" + nrow.source + "|" + nrow.attempts;
    if(!pivot[key]) pivot[key] = {};
    pivot[key][nrow.status] = (pivot[key][nrow.status] || 0) + 1;
  });

  let grouped = {};
  for(let key in pivot){
    let [store, source, attempt] = key.split("|");
    let storeLabel = store + "|" + source; // keep Blaze/Bolt rows for the same store name separate
    if(!grouped[storeLabel]) grouped[storeLabel] = {};
    grouped[storeLabel][attempt] = pivot[key];
  }

  let html = `
  <div id="downloadArea">
  <div class="table-header-bar">
    Zippee &lt;&gt; PAN INDIA Pendency Report
  </div>
  <table>
    <tr>
      <th>Darkstore</th>
      <th>No. of Attempts</th>
      ${statuses.map(s=>`<th>${s}</th>`).join("")}
      <th>Total</th>
    </tr>
  `;

  let gTotal = {};
  statuses.forEach(s=>gTotal[s]=0);
  let grand = 0;

  // Sort store labels for stable output
  let storeLabels = Object.keys(grouped).sort();

  storeLabels.forEach(storeLabel=>{
    let [store, source] = storeLabel.split("|");
    let attemptsArr = Object.keys(grouped[storeLabel]).sort((a,b)=>a-b);

    let validAttempts = attemptsArr.filter(attempt=>{
      let rowData = grouped[storeLabel][attempt];
      return statuses.some(s => (rowData[s] || 0) > 0);
    });

    if(validAttempts.length === 0) return;

    let firstRow = true;
    let storeTotal = 0;
    let tagClass = source === "bolt" ? "source-bolt" : "source-blaze";
    let tagText = source === "bolt" ? "BOLT" : "BLAZE";

    validAttempts.forEach(attempt=>{
      let rowData = grouped[storeLabel][attempt];
      let rowTotal = 0;
      statuses.forEach(s=>{ rowTotal += (rowData[s] || 0); });

      html += `<tr>`;

      if(firstRow){
        html += `<td rowspan="${validAttempts.length}">
          <span style="font-weight:600;font-size:12px;">${prettifyStoreName(store)}</span>
          <span class="source-tag ${tagClass}">${tagText}</span>
        </td>`;
        firstRow = false;
      }

      html += `<td><b>${attempt} Attempts</b></td>`;

      statuses.forEach(s=>{
        let val = rowData[s] || 0;
        gTotal[s] += val;
        html += `<td>${val}</td>`;
      });

      grand += rowTotal;
      storeTotal += rowTotal;

      html += `<td>${rowTotal}</td></tr>`;
    });

    if(storeTotal > 0){
      html += `<tr style="background:#f1f3f5;font-weight:600;font-size:12px;">
        <td colspan="2">Subtotal</td>`;

      statuses.forEach(s=>{
        let sub = validAttempts.reduce((sum, attempt)=>{
          let rowData = grouped[storeLabel][attempt];
          return sum + (rowData[s] || 0);
        }, 0);
        html += `<td>${sub}</td>`;
      });

      html += `<td>${storeTotal}</td></tr>`;
    }
  });

  html += `<tr class="total">
    <td colspan="2"><b>Total</b></td>`;

  statuses.forEach(s=>{
    html += `<td>${gTotal[s]}</td>`;
  });

  html += `<td>${grand}</td></tr></table>

  <div class="watermark">
    Powered by SASA Automation | Zippee
  </div>

  </div>`;

  document.getElementById("tableContainer").innerHTML = html;
}

/* ========================= EXPORTS ========================= */

function downloadImage(){
  let area = document.getElementById("downloadArea");
  html2canvas(area, {
    scale: 3,
    useCORS: true,
    backgroundColor: "#ffffff",
    width: area.offsetWidth,
    height: area.offsetHeight,
    scrollX: 0,
    scrollY: -window.scrollY,
    windowWidth: document.documentElement.offsetWidth
  }).then(canvas=>{
    let link = document.createElement("a");
    link.download = "report.png";
    link.href = canvas.toDataURL();
    link.click();
  });
}

function downloadCSV(){
  let selectedStatuses = getSelectedStatuses();

  let deduped = getFilteredDeduped()
    .filter(nrow => selectedStatuses.includes(nrow.status));

  let exportRows = deduped.map(nrow => ({
    "Source": nrow.source.toUpperCase(),
    "Darkstore": prettifyStoreName(nrow.store),
    "Raw Warehouse Value": nrow.store,
    "AWB": nrow.awb,
    "Order Number": nrow.orderNumber,
    "Brand": nrow.brand,
    "Trip": nrow.trip,
    "Attempts": nrow.attempts,
    "Status": nrow.status,
    "Creation Date": nrow.creationDate ? nrow.creationDate.toLocaleString() : "",
    "Customer Name": nrow.customerName,
    "Customer Mobile": nrow.customerMobile,
    "Delivery Address": nrow.deliveryAddress,
    "Delivery Pincode": nrow.deliveryPincode,
    "Rider Name": nrow.riderName
  }));

  let csv = Papa.unparse(exportRows);
  let blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  let link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "filtered_data.csv";
  link.click();
}

/* ========================= INIT ========================= */

createFilter();
renderTable(getSelectedStatuses());

</script>

</body>
</html>
