<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SASA CSV Merger</title>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
*{ box-sizing:border-box; margin:0; padding:0; }
:root{
    --bg:#EEF1E8; --panel:#F8F9F4; --card:#FFFFFF; --border:#D8DDCE;
    --text:#1F2937; --muted:#64748B; --blue:#2563EB; --green:#16A34A; --red:#B91C1C;
}
@media (prefers-color-scheme: dark){
    :root{
        color-scheme:dark;
        --bg:#14161A; --panel:#1C1F24; --card:#23272E; --border:#343A43;
        --text:#E5E7EB; --muted:#9CA3AF; --blue:#60A5FA; --green:#4ADE80; --red:#F87171;
    }
}
body{ font-family:Inter,"Segoe UI",Arial,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding:32px 16px; }
.wrap{ max-width:820px; margin:auto; }
h1{ font-size:24px; font-weight:800; }
h1 span{ color:var(--blue); }
.sub{ color:var(--muted); font-size:14px; margin:6px 0 22px; line-height:1.5; }

.drop{
    border:1.5px dashed var(--border); background:var(--panel); border-radius:16px;
    padding:30px; text-align:center;
}
.drop.over{ border-color:var(--blue); }
.drop p{ color:var(--muted); font-size:14px; margin-bottom:14px; }
input[type=file]{ display:none; }

button, .btn{
    border:none; border-radius:10px; padding:11px 18px; font-weight:700; font-size:14px;
    cursor:pointer; display:inline-block; font-family:inherit;
}
button:focus-visible, .btn:focus-visible{ outline:2px solid var(--blue); outline-offset:2px; }
.primary{ background:var(--blue); color:#fff; }
.success{ background:var(--green); color:#fff; }
.success:disabled{ opacity:.45; cursor:not-allowed; }
.link{ background:none; color:var(--red); padding:6px 10px; font-size:13px; }

.files{ margin:18px 0; display:grid; gap:10px; }
.file{
    display:flex; justify-content:space-between; align-items:center; gap:12px;
    background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px 14px;
}
.file b{ font-size:14px; word-break:break-all; }
.file small{ display:block; color:var(--muted); font-size:12px; margin-top:3px; }
.newest{ color:var(--green); font-weight:700; }


.summary{ margin:18px 0; font-size:14px; line-height:1.7; }
.summary strong{ font-size:20px; }
.warn{ color:var(--red); font-size:13px; margin-top:6px; }
.actions{ display:flex; gap:10px; flex-wrap:wrap; }
</style>
</head>
<body>
<div class="wrap">
    <h1><span>SASA</span> CSV Merger</h1>
    <p class="sub">Combine Detailed_Report CSVs (for example Last Month and This Month) into one file.
       Columns are matched by name, so files don't need the same column order.</p>

    <div class="drop" id="drop">
        <p>Drop CSV files here, or</p>
        <label for="fileInput" class="btn primary">Select CSV files</label>
        <input type="file" id="fileInput" accept=".csv" multiple>
    </div>

    <div class="files" id="files"></div>


    <div class="summary" id="summary">Add at least two files to merge.</div>

    <div class="actions">
        <button class="success" id="downloadBtn" disabled>Download merged CSV</button>
    </div>
</div>

<script>
const AWB_COLUMNS = ["Zippee AWB","AWB Number","Order AWB","AWB","AWB No","Shipment AWB","Tracking Number","Tracking ID"];

let files = []; // { name, exportedAt, fields, rows, awbCol }

const $ = id => document.getElementById(id);

function unwrap(v){
    return String(v ?? "").trim().replace(/^="?/, "").replace(/"$/, "").trim();
}

function fmt(n){ return Number(n).toLocaleString("en-IN"); }

function fmtDate(ms){
    const d = new Date(ms), p = n => String(n).padStart(2,"0");
    return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function esc(s){
    return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;" }[c]));
}

// Export time from the filename (..._20261111-164400IST.csv), else last-modified
function exportTime(file){
    const m = file.name.match(/(\d{4})(\d{2})(\d{2})-(\d{2})(\d{2})(\d{2})(?:IST)?\.csv$/i);
    if(m) return new Date(+m[1], +m[2]-1, +m[3], +m[4], +m[5], +m[6]).getTime();
    return file.lastModified || Date.now();
}

function parse(file){
    return new Promise(resolve => {
        Papa.parse(file, {
            header:true,
            skipEmptyLines:"greedy",
            complete: r => resolve({ file, r }),
            error: e => resolve({ file, error: e.message || String(e) })
        });
    });
}

async function addFiles(list){
    const csvs = [...list].filter(f => /\.csv$/i.test(f.name));
    if(!csvs.length){ alert("Please choose .csv files."); return; }

    const results = await Promise.all(csvs.map(parse));
    const errors = [];

    results.forEach(({ file, r, error }) => {
        if(error){ errors.push(`${file.name}: ${error}`); return; }
        const fields = (r.meta.fields || []).map(f => f.trim());
        const rows = r.data.map(row => {
            const o = {};
            Object.keys(row).forEach(k => { o[k.trim()] = row[k]; });
            return o;
        });
        files = files.filter(f => f.name !== file.name); // same name replaces
        files.push({
            name: file.name,
            exportedAt: exportTime(file),
            fields,
            rows,
            awbCol: AWB_COLUMNS.find(c => fields.includes(c)) || null
        });
    });

    if(errors.length) alert("Some files could not be read:\n\n" + errors.join("\n"));
    render();
}

function merge(){
    const dedupe = true;
    const ordered = [...files].sort((a,b) => b.exportedAt - a.exportedAt);

    const fields = [];
    const seenField = new Set();
    ordered.forEach(f => f.fields.forEach(c => {
        if(!seenField.has(c)){ seenField.add(c); fields.push(c); }
    }));

    const seenAwb = new Set();
    const rows = [];
    let duplicates = 0;

    ordered.forEach(f => {
        f.kept = 0;
        f.rows.forEach(row => {
            const awb = f.awbCol ? unwrap(row[f.awbCol]) : "";
            if(dedupe && awb){
                if(seenAwb.has(awb)){ duplicates++; return; }
                seenAwb.add(awb);
            }
            rows.push(row);
            f.kept++;
        });
    });

    return { fields, rows, duplicates, ordered };
}

function render(){
    const list = $("files");
    if(!files.length){
        list.innerHTML = "";
        $("summary").textContent = "Add at least two files to merge.";
        $("downloadBtn").disabled = true;
        return;
    }

    const m = merge();
    const newest = m.ordered[0].name;
    const dedupe = true;

    list.innerHTML = m.ordered.map(f => `
        <div class="file">
            <div>
                <b>${esc(f.name)}</b>
                <small>${fmt(f.rows.length)} rows${dedupe && f.kept !== f.rows.length ? ` (${fmt(f.kept)} kept)` : ""}
                • exported ${fmtDate(f.exportedAt)}
                ${files.length > 1 && f.name === newest ? ' • <span class="newest">newest</span>' : ""}</small>
            </div>
            <button type="button" class="link" data-name="${esc(f.name)}">Remove</button>
        </div>`).join("");

    list.querySelectorAll("button[data-name]").forEach(b =>
        b.addEventListener("click", () => {
            files = files.filter(f => f.name !== b.dataset.name);
            render();
        }));

    const total = files.reduce((s,f) => s + f.rows.length, 0);
    const noAwb = files.filter(f => !f.awbCol).map(f => f.name);

    $("summary").innerHTML = `
        <strong>${fmt(m.rows.length)}</strong> rows in the merged file<br>
        ${fmt(total)} rows across ${files.length} file${files.length > 1 ? "s" : ""}
        ${dedupe ? ` • ${fmt(m.duplicates)} duplicate AWB${m.duplicates === 1 ? "" : "s"} removed` : ""}
        • ${fmt(m.fields.length)} columns
        ${files.length < 2 ? `<div class="warn">Add another file to merge with.</div>` : ""}
        ${dedupe && noAwb.length ? `<div class="warn">No AWB column found in ${esc(noAwb.join(", "))}, so its rows can't be de-duplicated.</div>` : ""}`;

    $("downloadBtn").disabled = files.length < 2;
}

function download(){
    const { fields, rows } = merge();
    const csv = "\uFEFF" + Papa.unparse({ fields, data: rows.map(r => fields.map(f => r[f] ?? "")) });
    const blob = new Blob([csv], { type:"text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const p = n => String(n).padStart(2,"0"), d = new Date();
    const a = document.createElement("a");
    a.href = url;
    a.download = `Merged_Detailed_Report_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
}

$("fileInput").addEventListener("change", e => { addFiles(e.target.files); e.target.value = ""; });
$("downloadBtn").addEventListener("click", download);

const drop = $("drop");
drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", e => { e.preventDefault(); drop.classList.remove("over"); addFiles(e.dataTransfer.files); });
</script>
</body>
</html>
